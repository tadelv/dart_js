name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: stable
      - run: dart pub get --no-example
      - run: dart analyze lib
      # Full suite on Windows (QuickJS). macOS (JavaScriptCore) runs the timer
      # conformance suite: three pre-existing flutter_js_test.dart cases fail on
      # macOS (jscore primitive conversion quirks and a missing QuickJS dylib),
      # unrelated to the timer work.
      - run: dart test --concurrency=1
        if: runner.os == 'Windows'
      - run: dart test test/timer_primitives_test.dart --concurrency=1
        if: runner.os == 'macOS'

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: 8.14.5
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: gradle :flutter_js:assembleDebug --no-daemon
        working-directory: example/android

  linux-prebuilt:
    name: Linux prebuilt .so
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      # Rebuild the QuickJS bridge from source (see linux/shared/CMakeLists.txt)
      # and compare its exported symbols against the committed prebuilt .so.
      # Linux is the only platform shipping a committed binary; a stale .so
      # surfaces as 'undefined symbol' on FFI lookup at runtime.
      - name: Verify committed .so matches fresh build
        run: |
          set -euo pipefail
          cmake -S linux/shared -B build
          cmake --build build -j
          FRESH=build/libquickjs_c_bridge_plugin.so
          COMMITTED=linux/shared/libquickjs_c_bridge_plugin.so
          nm -D --defined-only "$FRESH" | awk '{print $3}' | sort > /tmp/fresh.exports
          nm -D --defined-only "$COMMITTED" | awk '{print $3}' | sort > /tmp/committed.exports
          if ! diff -u /tmp/committed.exports /tmp/fresh.exports; then
            echo "::error::linux/shared/libquickjs_c_bridge_plugin.so is stale. Rebuild and commit it: cmake -S linux/shared -B build && cmake --build build && cp build/libquickjs_c_bridge_plugin.so linux/shared/"
            exit 1
          fi
          echo "Committed .so exports match fresh build ($(wc -l < /tmp/fresh.exports) symbols)"

      # Always upload the fresh build so a stale .so can be recovered by
      # downloading the artifact and committing it.
      - name: Upload fresh build (recovery artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libquickjs_c_bridge_plugin-linux-x64
          path: build/libquickjs_c_bridge_plugin.so
